<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Perfil · Caribe Explora</title>
<link rel="icon" href="img/logo.png"><link rel="stylesheet" href="vendor/fa/css/all.min.css"><link rel="stylesheet" href="css/styles.css"></head><body>
<div id="hdr"></div>
<main class="plan" style="grid-template-columns:420px 1fr">
 <div class="col"><div class="box ptop"><div class="avatar big" id="bigav">G</div><h3 id="pn2"></h3><p class="sub">Viajero de Caribe Explora</p></div>
  <div class="box"><h3>Mis cifras</h3><div class="pstats" id="ps"></div></div></div>
 <div class="col"><div class="box"><h3>Datos del perfil</h3><label class="lbl">Nombre<div class="field"><input id="nm" maxlength="30"></div></label><button class="btn" id="sv" style="margin-top:16px">Guardar cambios</button></div>
  <div class="box"><h3>Atajos</h3><div class="links"><a href="favoritos.html"><i class="fa-regular fa-heart"></i>Mis favoritos</a><a href="itinerario.html"><i class="fa-regular fa-calendar"></i>Mi itinerario</a><a href="planificar.html"><i class="fa-solid fa-person-walking-luggage"></i>Planificar un viaje</a></div></div>
  <div class="box"><h3>Datos guardados</h3><p class="sub">Tus favoritos, itinerario y preferencias se guardan solo en este navegador.</p><button class="btn ghost danger" id="rs"><i class="fa-regular fa-trash-can"></i> Restablecer todo</button></div></div>
</main>
<script src="js/data.js"></script><script src="js/common.js"></script>
<script>renderHeader('');
const u=store.get('user',{name:'Gillian'});$('#nm').value=u.name;
function paint(){const n=store.get('user',{name:'Gillian'}).name;$('#pn2').textContent=n;$('#bigav').textContent=(n[0]||'G').toUpperCase();
 const f=favs(),it=store.get('itin',null);$('#ps').innerHTML=`<div><b>${f.length}</b><span>Favoritos</span></div><div><b>${it?it.days.length:0}</b><span>Días planificados</span></div><div><b>${it?it.cities.length:0}</b><span>Ciudades</span></div>`}
paint();
$('#sv').onclick=()=>{const n=$('#nm').value.trim();if(!n)return toast('Escribe tu nombre',false);store.set('user',{name:n});$('#av').textContent=n[0].toUpperCase();paint();toast('Perfil actualizado')};
$('#rs').onclick=()=>{if(confirm('¿Borrar favoritos, itinerario y preferencias?')){['favs','itin','plan','user','notifs'].forEach(store.del);toast('Datos restablecidos');setTimeout(()=>location.reload(),700)}};
</script></body></html>
